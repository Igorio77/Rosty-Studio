[project]
name = "rostify"
version = "0.1.0"
description = "Rostify — customizable workforce scheduling desktop app (PySide6, local-first)."
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.11",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
rostify = "rostify.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rostify = ["services/data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
